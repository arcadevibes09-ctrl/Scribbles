<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <title>Suru</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Indie+Flower&family=Kalam:wght@400;700&family=Patrick+Hand&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <!-- ERROR HANDLER (Moved to HEAD so it catches everything instantly) -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        alert("Error: " + message + "\nAt: " + source + ":" + lineno + ":" + colno + "\nStack: " + (error ? error.stack : ''));
        return true; 
      };
      window.onunhandledrejection = function(event) {
        alert("Promise Rejection: " + event.reason + "\nStack: " + (event.reason ? event.reason.stack : ''));
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
